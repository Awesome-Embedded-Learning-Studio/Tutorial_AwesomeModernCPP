# Build Examples Workflow
# Compiles all CMake projects under code/ to ensure code examples remain buildable
name: Build Examples

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'code/**'
      - 'scripts/build_examples.py'
      - '.github/workflows/build-examples.yml'
      - 'third_party/libestdx'
  push:
    branches: [main]
    paths:
      - 'code/**'
      - 'scripts/build_examples.py'
      - 'third_party/libestdx'

jobs:
  build-host:
    name: Host Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-14 ninja-build ccache
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14 100

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-host-${{ github.run_id }}
          restore-keys: |
            ccache-host-

      - name: Build host examples
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"
          python3 scripts/build_examples.py --host

  build-host-msvc:
    name: Host Examples (MSVC)
    runs-on: windows-latest
    env:
      # sccache 本地磁盘缓存(跨 run 持久化靠下方 actions/cache)。
      # MSVC 线原本完全无缓存,每个 PR 全量重编 147 个工程(#200)
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G
      # CPM 源码缓存:chrome_design 的 Catch2 只下载一次,configure 期不再含网络(#218)
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 注入 MSVC 开发者环境(cl 进入 PATH);windows-latest 自带 CMake/Ninja/Python
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # cl 没有 ccache 对应物,编译缓存走 sccache。钉 v0.17.0 手动下载
      # (与 Renode 同风格,不引入第三方 action);脚本侧自动探测并启用
      - name: Install sccache
        run: |
          $ver = "0.17.0"
          $dir = "$env:RUNNER_TEMP\sccache\sccache-v$ver-x86_64-pc-windows-msvc"
          curl.exe -sL "https://github.com/mozilla/sccache/releases/download/v$ver/sccache-v$ver-x86_64-pc-windows-msvc.zip" -o "$env:RUNNER_TEMP\sccache.zip"
          Expand-Archive "$env:RUNNER_TEMP\sccache.zip" -DestinationPath "$env:RUNNER_TEMP\sccache" -Force
          # GITHUB_PATH 只对后续 step 生效,本步内的版本检查必须走全路径
          Add-Content $env:GITHUB_PATH $dir
          & "$dir\sccache.exe" --version

      # run_id 进 key + 前缀 restore:每次必存最新、必还原最近一份(与 ubuntu 线同款)
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: sccache-msvc-${{ github.run_id }}
          restore-keys: |
            sccache-msvc-

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.cpm-cache
          key: cpm-source-${{ github.run_id }}
          restore-keys: |
            cpm-source-

      # Windows 用户免 WSL 直接构建的验收线:平台性工程(POSIX socket/epoll 等)
      # 由脚本内 MSVC_SKIP_PROJECTS 显式跳过并注明原因
      - name: Build host examples (MSVC)
        run: python scripts/build_examples.py --host --msvc

      # 仅诊断输出(命中率眼见为实),失败不标红;stop-server 确保缓存落盘后再归档
      - name: Show sccache stats and stop server
        if: always()
        run: |
          sccache --show-stats
          sccache --stop-server
          exit 0

  # mingw(Windows 上的 GCC)线:本地开发者最常见的 Windows GCC 环境。
  # 与 Ubuntu GCC 线的差异主要在链接层(如 libstdc++exp 需显式链),
  # 提前在 CI 暴露,避免"Linux 绿、Windows GCC 红"的隐性回归。
  build-host-mingw:
    name: Host Examples (mingw GCC)
    runs-on: windows-latest
    env:
      # 缓存目录显式钉到 Windows 风格路径:actions/cache 在 Node 侧跑只认 Windows
      # 路径,ccache/CPM(mingw 原生程序)同样认。原状是 ccache 装了却无持久化,
      # 每个 PR 全量重建(#200);CPM 每次重下 Catch2(#218)
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 2G
      CPM_SOURCE_CACHE: ${{ github.workspace }}\.cpm-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          # native(python)而非 msys 模拟层版:sys.platform=win32,
          # 与本地 Windows 用户环境一致,MSVC skip 清单逻辑同样生效。
          # 只装 gcc 精准包,不装 toolchain 全家桶(gdb 等用不到)
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-python

      # 与 ubuntu 线同款:run_id 进 key + 前缀 restore,每个 PR 不再全量重建
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-mingw-${{ github.run_id }}
          restore-keys: |
            ccache-mingw-

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.cpm-cache
          key: cpm-source-${{ github.run_id }}
          restore-keys: |
            cpm-source-

      - name: Build host examples (mingw GCC)
        shell: msys2 {0}
        run: python scripts/build_examples.py --host

      # 仅诊断输出(命中率眼见为实),失败不标红
      - name: Show ccache stats
        if: always()
        shell: msys2 {0}
        run: ccache --show-stats

  build-stm32:
    name: STM32 Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build ccache

      # Renode 官方不进 apt 源,Linux 用 linux-portable 包(自带 .NET 运行时)。
      # 钉 v1.16.1:与教程声明的本地验证环境一致。
      - name: Install Renode
        run: |
          curl -sL https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable.tar.gz -o /tmp/renode.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf /tmp/renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
          "$HOME/renode/renode" --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-stm32-${{ github.run_id }}
          restore-keys: |
            ccache-stm32-

      - name: Build libestdx examples (third_party submodule)
        working-directory: third_party/libestdx
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arch/stm32f103c8t6.cmake
          cmake --build build
