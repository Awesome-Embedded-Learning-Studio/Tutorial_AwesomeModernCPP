name: Build Check

on:
  pull_request:
    branches: [main]
  # 合并后在 main 跑一次,让 cache 沉进 main 作用域:PR 间 cache 互相隔离,
  # 只在 pull_request 触发的话,每个新 PR 首跑必 miss(Windows 冷构建 ~13min);
  # 有 main 条目兜底后,新 PR 首跑经 restore-keys 命中,只重建改动的卷。
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false   # 一条腿挂了也让另一条跑完,PR 上能同时看到两个 OS 的结果
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Python virtual environment
        run: python -m venv .venv

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: site/.vitepress/.build-cache
          key: vitepress-build-${{ runner.os }}-${{ hashFiles('documents/**', 'site/.vitepress/config/**', 'site/.vitepress/plugins/**', 'site/.vitepress/public/**', 'site/.vitepress/theme/**', 'scripts/build.ts', 'package.json', 'pnpm-lock.yaml') }}
          # 兜底必须限定 runner.os:manifest 是纯内容哈希(跨 OS 恒等),
          # 若不限定,Windows 腿会恢复 Linux 条目并整卷判为 cached,跳过
          # 全部分卷构建——Windows 专属代码路径(junction/重试)就测不到了。
          restore-keys: |
            vitepress-build-${{ runner.os }}-

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          BUILD_CONCURRENCY: 8
