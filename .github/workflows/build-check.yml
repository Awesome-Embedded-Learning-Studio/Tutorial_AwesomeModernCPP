name: Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    # 只留 Linux 腿:站点构建缓存按 documents 内容 hash 打 key,文档一改即整体失效,
    # Windows 腿全量重建要拖 ~19 分钟;缓存策略重定前先下掉,恢复时把 matrix 加回来
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Python virtual environment
        run: python -m venv .venv

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: site/.vitepress/.build-cache
          key: vitepress-build-${{ runner.os }}-${{ hashFiles('documents/**', 'site/.vitepress/config/**', 'site/.vitepress/plugins/**', 'site/.vitepress/public/**', 'site/.vitepress/theme/**', 'scripts/build.ts', 'scripts/tags.json', 'package.json', 'pnpm-lock.yaml', '!site/.vitepress/**/*.test.ts', '!site/.vitepress/**/README.md') }}
          # 只恢复同 OS 的构建产物,别跨系统混用。
          restore-keys: |
            vitepress-build-${{ runner.os }}-

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          BUILD_CONCURRENCY: 8
